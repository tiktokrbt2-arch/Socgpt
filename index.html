<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>الخبير الشامل | ذكاء اصطناعي حقيقي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 30%, #f0f3f8 60%, #e9eef3 100%);
      background-attachment: fixed;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .bg-animation {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(79, 140, 240, 0.12), rgba(100, 160, 255, 0.02));
      animation: floatCircle 12s infinite ease-in-out;
      filter: blur(35px);
    }

    .circle:nth-child(1) { width: 350px; height: 350px; top: -80px; right: -60px; }
    .circle:nth-child(2) { width: 280px; height: 280px; bottom: -70px; left: -50px; animation-delay: -4s; background: radial-gradient(circle at 30% 30%, rgba(120, 100, 240, 0.1), rgba(140, 120, 255, 0.02)); }
    .circle:nth-child(3) { width: 200px; height: 200px; top: 40%; left: 15%; animation-delay: -8s; background: radial-gradient(circle at 30% 30%, rgba(240, 150, 100, 0.08), rgba(255, 170, 120, 0.01)); }

    @keyframes floatCircle {
      0% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(25px, -20px) scale(1.08); }
      50% { transform: translate(-15px, 18px) scale(0.94); }
      75% { transform: translate(-22px, -12px) scale(1.03); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .particles {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: rgba(70, 120, 200, 0.3);
      border-radius: 50%;
      animation: particleFloat 8s infinite ease-in-out;
    }
    @keyframes particleFloat {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-90vh) rotate(720deg); opacity: 0; }
    }

    .chat-container {
      width: 100%; max-width: 880px; height: 92vh;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex; flex-direction: column; overflow: hidden;
      position: relative; z-index: 2;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .header {
      padding: 14px 22px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(25px);
    }

    .logo-area { display: flex; align-items: center; gap: 10px; }
    .brain-icon { font-size: 26px; animation: gentlePulse 2.5s infinite ease-in-out; }
    @keyframes gentlePulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .header-title { color: #1a1f2e; font-weight: 650; font-size: 1.1rem; }
    .expert-badge {
      background: linear-gradient(135deg, #e8f0fe, #d4e2fc);
      padding: 4px 12px; border-radius: 20px;
      font-size: 0.7rem; color: #2b5a9c; font-weight: 500;
      animation: softGlow 2.5s infinite;
    }
    @keyframes softGlow {
      0% { box-shadow: 0 0 4px rgba(70, 120, 200, 0.2); }
      50% { box-shadow: 0 0 14px rgba(70, 120, 200, 0.45); }
      100% { box-shadow: 0 0 4px rgba(70, 120, 200, 0.2); }
    }
    .status-dot {
      width: 8px; height: 8px; background: #34c759;
      border-radius: 50%; display: inline-block;
      animation: statusPulse 1.8s infinite; margin-left: 6px;
    }
    @keyframes statusPulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.6); }
      100% { opacity: 1; transform: scale(1); }
    }

    .messages {
      flex: 1; overflow-y: auto; padding: 18px 16px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex; align-items: flex-end; gap: 10px;
      animation: messageSlide 0.45s ease-out;
    }
    @keyframes messageSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user-row { justify-content: flex-end; }

    .avatar {
      width: 38px; height: 38px; border-radius: 14px;
      background: linear-gradient(145deg, #ffffff, #eef2f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.04);
    }

    .bubble {
      max-width: 72%; padding: 13px 17px; border-radius: 18px;
      font-size: 0.92rem; line-height: 1.6;
      word-wrap: break-word; position: relative; transition: 0.2s;
    }
    .user-bubble {
      background: linear-gradient(135deg, #1a56d0, #2b6ae0);
      color: #ffffff; border-bottom-left-radius: 5px;
      box-shadow: 0 6px 18px rgba(26, 86, 208, 0.25);
    }
    .ai-bubble {
      background: #ffffff; color: #1e2532;
      border-bottom-right-radius: 5px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.04);
    }

    .typing-indicator { display: flex; gap: 5px; padding: 6px 0; }
    .typing-indicator span {
      width: 7px; height: 7px; background: #90a4ce;
      border-radius: 50%; animation: typingBounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-9px); opacity: 1; }
    }

    .input-area {
      padding: 12px 16px;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(25px);
      display: flex; align-items: center; gap: 10px;
    }
    .chat-input {
      flex: 1; background: #f2f4f8;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 26px; padding: 12px 18px;
      color: #1a1f2e; font-family: inherit; font-size: 0.93rem;
      outline: none; transition: all 0.3s;
    }
    .chat-input:focus {
      border-color: #3b76e0;
      box-shadow: 0 0 0 3px rgba(59, 118, 224, 0.1);
      background: #ffffff;
    }
    .send-btn {
      background: linear-gradient(145deg, #1a56d0, #1e4db0);
      border: none; width: 46px; height: 46px; border-radius: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: white; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 14px rgba(26, 86, 208, 0.35);
    }
    .send-btn:hover { transform: scale(1.05); background: #2563eb; }
    .send-btn:active { transform: scale(0.94); }

    .api-key-btn {
      background: none; border: 1px solid rgba(0,0,0,0.1);
      border-radius: 20px; padding: 6px 14px; font-size: 0.78rem;
      color: #3b6cb4; cursor: pointer; margin-left: 8px;
      transition: 0.2s; font-family: inherit; background: rgba(255,255,255,0.5);
    }
    .api-key-btn:hover { background: rgba(59, 108, 180, 0.08); }

    .modal-overlay {
      display: none; position: fixed; top:0; left:0;
      width:100%; height:100%; background: rgba(0,0,0,0.35);
      z-index: 20; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: white; padding: 28px 24px; border-radius: 22px;
      width: 90%; max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2); text-align: center;
    }
    .modal-box input {
      width: 100%; padding: 12px; margin: 12px 0;
      border: 1px solid #ddd; border-radius: 14px;
      font-family: inherit; direction: ltr;
    }
    .modal-box button {
      background: #1a56d0; color: white; border: none;
      padding: 10px 28px; border-radius: 20px;
      cursor: pointer; font-family: inherit; margin: 4px;
    }
  </style>
</head>
<body>

<div class="bg-animation">
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>
</div>
<div class="particles" id="particlesContainer"></div>

<div class="modal-overlay" id="apiModal">
  <div class="modal-box">
    <h3 style="margin-bottom:8px;">🔑 أدخل مفتاح Gemini API</h3>
    <p style="font-size:0.8rem;color:#555;">احصل عليه مجاناً من <a href="https://aistudio.google.com/apikey" target="_blank" style="color:#1a56d0;">aistudio.google.com</a></p>
    <input type="text" id="apiKeyInput" placeholder="الصق المفتاح هنا..." style="direction:ltr;">
    <br>
    <button onclick="saveApiKey()">💾 حفظ واستخدام</button>
    <button onclick="document.getElementById('apiModal').classList.remove('active')" style="background:#eee;color:#333;">إلغاء</button>
  </div>
</div>

<div class="chat-container">
  <div class="header">
    <div class="logo-area">
      <span class="brain-icon">🧠</span>
      <span class="header-title">الخبير الشامل</span>
      <span class="expert-badge">✨ برمجة · تطبيقات · كل المعارف</span>
    </div>
    <div style="display:flex;align-items:center;">
      <span class="status-dot"></span>
      <span style="color:#3b6cb4;font-size:0.78rem;">متصل بالذكاء الحي</span>
      <button class="api-key-btn" onclick="document.getElementById('apiModal').classList.add('active')">⚙️ المفتاح</button>
    </div>
  </div>

  <div class="messages" id="messagesContainer">
    <div class="message-row">
      <div class="avatar">🤖</div>
      <div class="bubble ai-bubble">
        أهلاً بك! 🌟 أنا خبير حقيقي بالذكاء الاصطناعي، متخصص في برمجة المواقع والتطبيقات وكل المجالات. أدرس أسلوبك وأستخدم الإيموجيز مثلك. اسألني أي شيء وسأجيبك بدقة 🚀
      </div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" class="chat-input" id="userInput" placeholder="اسأل عن البرمجة، التطبيقات، أو أي موضوع..." autofocus>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<script>
  (function() {
    // إنشاء جسيمات
    const particlesContainer = document.getElementById('particlesContainer');
    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = (60 + Math.random() * 40) + '%';
      p.style.animationDelay = Math.random() * 8 + 's';
      p.style.animationDuration = (6 + Math.random() * 10) + 's';
      p.style.width = (2 + Math.random() * 4) + 'px';
      p.style.height = p.style.width;
      particlesContainer.appendChild(p);
    }

    const STORAGE_KEY = 'gemini_api_key_ksa';
    
    function getApiKey() {
      return localStorage.getItem(STORAGE_KEY) || '';
    }

    window.saveApiKey = function() {
      const input = document.getElementById('apiKeyInput');
      const key = input.value.trim();
      if (key) {
        localStorage.setItem(STORAGE_KEY, key);
        document.getElementById('apiModal').classList.remove('active');
        // إعادة تعيين النموذج النشط
        activeModel = null;
        addMessage('ai', '✅ تم حفظ مفتاح API بنجاح! جاري التحقق من النماذج المتاحة...');
        detectAvailableModel();
        input.value = '';
      }
    };

    document.getElementById('apiKeyInput').value = getApiKey();

    const messagesContainer = document.getElementById('messagesContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    const userStyle = {
      emojis: [],
      messageHistory: []
    };

    // متغير لتخزين النموذج النشط
    let activeModel = null;

    function addMessage(role, text) {
      const row = document.createElement('div');
      const isUser = role === 'user';
      row.className = `message-row ${isUser ? 'user-row' : ''}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = isUser ? '👤' : '🧠';
      
      const bubble = document.createElement('div');
      bubble.className = `bubble ${isUser ? 'user-bubble' : 'ai-bubble'}`;
      bubble.textContent = text;
      
      if (isUser) {
        row.appendChild(bubble);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }
      
      messagesContainer.appendChild(row);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return row;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'message-row';
      row.id = 'typingRow';
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🧠';
      const bubble = document.createElement('div');
      bubble.className = 'bubble ai-bubble';
      bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function hideTyping() {
      const tr = document.getElementById('typingRow');
      if (tr) tr.remove();
    }

    // 🔍 اكتشاف النماذج المتاحة تلقائياً
    async function detectAvailableModel() {
      const apiKey = getApiKey();
      if (!apiKey) return null;

      const modelsToTry = [
        'gemini-2.0-flash',
        'gemini-2.0-flash-lite',
        'gemini-1.5-flash',
        'gemini-1.5-pro',
        'gemini-pro'
      ];

      for (const model of modelsToTry) {
        try {
          const testResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: 'قل "النموذج يعمل" فقط' }] }]
            })
          });
          
          if (testResponse.ok) {
            console.log('✅ النموذج المتاح:', model);
            activeModel = model;
            return model;
          } else {
            console.log('❌ غير متاح:', model);
          }
        } catch (e) {
          console.log('❌ فشل:', model, e.message);
        }
      }
      return null;
    }

    // استدعاء API Gemini مع اكتشاف تلقائي
    async function callGeminiAPI(userMessage) {
      const apiKey = getApiKey();
      if (!apiKey) {
        document.getElementById('apiModal').classList.add('active');
        return '⚠️ الرجاء إدخال مفتاح Gemini API أولاً. اضغط على زر ⚙️ المفتاح أعلاه.';
      }

      // اكتشاف النموذج المناسب إذا لم يتم اكتشافه
      if (!activeModel) {
        addMessage('ai', '🔍 جاري اكتشاف النماذج المتاحة لحسابك...');
        const detected = await detectAvailableModel();
        if (!detected) {
          return '❌ عذراً، لم أجد أي نموذج متاح لحسابك. تأكد من:\n1. صحة مفتاح API\n2. تفعيل Gemini API في حساب Google Cloud\n3. وجود رصيد مجاني كافي';
        }
        addMessage('ai', `✅ تم اكتشاف النموذج: ${detected} - يمكنك البدء الآن!`);
      }

      const emojiRegex = /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu;
      const foundEmojis = userMessage.match(emojiRegex) || [];
      foundEmojis.forEach(e => { if (!userStyle.emojis.includes(e)) userStyle.emojis.push(e); });
      const userEmojiStr = userStyle.emojis.slice(-3).join(' ') || '✨';

      const conversationContext = userStyle.messageHistory.slice(-6).map(m => 
        `${m.role === 'user' ? 'المستخدم' : 'المساعد'}: ${m.content}`
      ).join('\n');

      const systemPrompt = `أنت خبير شامل ومتمكن في كل المجالات، خصوصاً برمجة المواقع والتطبيقات. أنت دقيق جداً ولا تخطئ. تدرس أسلوب المستخدم وتستخدم الإيموجيز مثله. المستخدم يستخدم هذه الإيموجيز كثيراً: ${userEmojiStr}. استخدمها في ردودك بشكل طبيعي. أسلوبك ودود ومحترف. أجب بدقة وإيجاز مفيد.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: [{
              parts: [{ text: `سجل المحادثة:\n${conversationContext}\n\nالمستخدم: ${userMessage}\n\nأجب بدقة وباستخدام الإيموجيز المناسبة:` }]
            }],
            generationConfig: {
              temperature: 0.7,
              topP: 0.9,
              maxOutputTokens: 1200
            }
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
          return data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          return `❌ خطأ: ${data.error.message}`;
        } else {
          return '⚠️ لم أستطع معالجة الرد. حاول مرة أخرى.';
        }
      } catch (error) {
        return `🔌 خطأ في الاتصال: ${error.message}`;
      }
    }

    async function handleSend() {
      const message = userInput.value.trim();
      if (!message) return;
      
      addMessage('user', message);
      userStyle.messageHistory.push({ role: 'user', content: message });
      userInput.value = '';
      
      showTyping();
      
      const aiResponse = await callGeminiAPI(message);
      
      hideTyping();
      addMessage('ai', aiResponse);
      userStyle.messageHistory.push({ role: 'assistant', content: aiResponse });
      
      userInput.focus();
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSend();
      }
    });

    if (!getApiKey()) {
      setTimeout(() => {
        document.getElementById('apiModal').classList.add('active');
      }, 800);
    } else {
      // اكتشاف تلقائي عند التحميل
      detectAvailableModel();
    }

    userInput.focus();
  })();
</script>
</body>
</html>
